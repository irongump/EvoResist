# ==============================================================================
# EvoResist Pipeline Configuration
# ==============================================================================
# Adjust paths and parameters below to match your environment.

# -- Output directory ---------------------------------------------------------
# Base directory for all pipeline outputs.
# Recommended: use a single-level relative path (e.g. "output", "results")
# so that scripts using relative back-references (../../) work correctly.
outdir: "output"

# -- Pipeline control ---------------------------------------------------------
# Stop the pipeline after a specific step. Valid values:
#   step1 / snp_calling        - SNP calling from FASTQ or SRA files
#   step2 / indel_calling      - INDEL calling from BAM files (per sample)
#   step3 / build_tree         - Phylogenetic tree building with IQ-TREE
#   step4 / branch_mutations   - Branch mutation extraction per lineage
#   step5 / ancestor_mutations - Ancestor mutation extraction (global)
#   step6 / merge_annotations  - Merge annotations and count convergent mutations
#   step7 / simulation / all   - GTR simulation for null distribution (full run)
#   step8 / dr_prep            - DR data preparation (train/test split, filtered candidates, initial lists)
#   step9 / dr_selection       - Full DR sweep (list1→LOO→list2→train/test evaluation; threshold + promoter)
#   step10 / dr_best_threshold - Select best convergence threshold per drug from sweep
#   step11 / dr_best_promoter  - Select best promoter length per drug from sweep
#   step12 / dr_final_evaluate - Final evaluation on full cohort (EvoResist, WHO G1+G2, WHO G1)
#   step13 / dr_lasso          - Incremental gain evaluation + LASSO logistic regression
#   step14 / dr_compare        - Compare EvoResist vs WHO performance (overall + stratified)
stop_at: "all"

# -- Input data type ----------------------------------------------------------
# Specify the format of the raw input data for SNP calling. Valid values:
#   auto   - Auto-detect: use FASTQ files if present in <outdir>/fastq/,
#            otherwise fall back to SRA conversion
#   fastq  - FASTQ files already exist; their location is given by fastq_dir
#            (SRA download is skipped entirely)
#   sra    - Input is SRA format; files are converted to FASTQ before processing
input_type: "auto"

# Directory containing per-sample FASTQ files.
# Required when input_type is "fastq"; ignored for "sra" and "auto" modes
# (in those modes FASTQs are placed in <outdir>/fastq/).
# Naming convention: <sample>_1.fastq.gz / <sample>_2.fastq.gz (paired-end)
#                 or <sample>.fastq.gz (single-end)
# fastq_dir: "data/fastq"

# -- Reference data -----------------------------------------------------------
# Path to the ancestral reference genome FASTA
reference: "data/tb.ancestor.fasta"
# Concatenated ancestor FASTA used for tree building
ancestor_concat_fasta: "data/tb.ancestor.concatenated.fasta"

# -- Sample information -------------------------------------------------------
# Directory containing per-lineage sample ID files.
# Each file must be named <lineage>_strain.txt (e.g., Lineage1.1_strain.txt).
strain_ids_dir: "data/strain_ids"

# Lineage filter (optional).
# When set, only the specified lineage(s) are processed; all others are skipped.
# Accepted formats:
#   Single lineage:  lineage: "Lineage1.1"
#   Multiple:        lineage: ["Lineage1.1", "Lineage2.3.4"]
# The value must match the base name of a file in strain_ids_dir, i.e.
# <strain_ids_dir>/<lineage>_strain.txt must exist.
# When omitted or set to null, all lineages in strain_ids_dir are processed.
# lineage: "Lineage1.1"

# -- SRA data (only needed when input_type is "sra" or "auto") ----------------
sra_dir: "data/sra"

# -- Filter / annotation data ------------------------------------------------
# Low-mappability regions file for filtering variants
low_ebr_file: "data/RLC_lowmapK50E4_H37Rv_pos.txt"
# SNP frequency data for quality filtering of convergent mutations
snp_freq_file: "data/convg_5_mutation_snp_freq.txt"
# Repeat and mobile element region files
repeat_region_file: "data/repeat_region.txt"
mobile_element_file: "data/mobile_element.txt"

# -- Ancestor mutation data ---------------------------------------------------
ancestor_mutation_file: "data/100k_5000_anc_db_mutation2_rmanc.txt"
ancestor_db_mutation_file: "data/100k_5000_db_mutation2.txt"
candidate_nodes_file: "data/100k_5000_level1_candidate_nodes.txt"
lineage_ancestor_file: "data/lineage_ancestor_nodes.csv"

# -- External tools -----------------------------------------------------------
varscan_jar: "scripts/VarScan.v2.3.9.jar"
# Picard JAR for INDEL calling (Step 2). Download from https://github.com/broadinstitute/picard/releases
picard_jar: "scripts/picard.jar"
# GATK3 JAR for INDEL calling (Step 2). Requires GenomeAnalysisTK.jar (GATK 3.x)
gatk_jar: "scripts/GenomeAnalysisTK.jar"

# -- Simulation parameters ---------------------------------------------------
num_simulations: 1000
num_mutations: 2345799

# -- Resource settings --------------------------------------------------------
threads_per_sample: 2
threads_tree: 64
threads_annotation: 24

# -- DR mutation selection analysis (Step 8+) ---------------------------------
# Base directory for drug resistance mutation selection outputs.
dr_results_dir: "dr_results"

# Per-drug best promoter length (bp) for the final evaluation and LASSO steps.
# Determined by running step11 / dr_best_promoter (05-select_best_params.R
# --step promoter) after the promoter-length sweep (step9 / dr_selection).
# Update the values below once the sweep results are available.
# Any drug not listed here defaults to 500 bp.
# dr_best_promoters:
#   RIF: 400
#   INH: 300
#   EMB: 500
#   PZA: 500
#   LFX: 600
#   MFX: 600
#   BDQ: 400
#   AMK: 500
#   STM: 500
#   ETO: 500
#   KAN: 500
#   CAP: 500
#   LZD: 500

# Directory containing per-sample SNP annotation files (one file per sample,
# named {sample}.ano with columns: position, ref, alt).
# Required when running step8 / dr_prep or step9 / dr_selection.
snp_anno_dir: ""

# Directory containing per-sample indel annotation files (one file per sample,
# named {sample}.indel.ano with columns: position, ref, alt).
# Required when running step8 / dr_prep or step9 / dr_selection.
indel_anno_dir: ""

# All-cohort indel file used to build drug-specific indel candidate lists.
# Accepts a .gz compressed or plain text file.
all_indel_file: "data/all_indel_100k.txt.gz"

# Convergent SNP file used to build drug-specific SNP candidate lists.
# Defaults to the output of step 6 (filter_convergent rule).
# Override here to use a pre-existing file (e.g. data/all_ann_convergent_flt_v3.txt.gz).
# dr_convergent_snp_file: "data/all_ann_convergent_flt_v3.txt.gz"
